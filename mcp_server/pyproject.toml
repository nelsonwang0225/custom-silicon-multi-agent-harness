[project]
name = "stratos-mcp-runtime"
version = "0.1.0"
description = "Isolated local Streamable HTTP runtime for the Stratos read-only MCP adapter"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../src", ".."]
addopts = "-ra --basetemp=.cache/mcp-pytest"
filterwarnings = ["error"]
