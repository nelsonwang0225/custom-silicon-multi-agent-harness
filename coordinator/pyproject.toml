[project]
name = "stratos-program-coordinator"
version = "0.1.0"
description = "Coordinator-led read-only Agents SDK harness with bounded specialist collaboration"
requires-python = ">=3.12,<3.13"
dependencies = ["openai-agents==0.22.2", "mcp==2.2.0", "python-dotenv>=1.2.3,<2", "httpx>=0.28,<1", "fastapi>=0.115,<0.116", "uvicorn>=0.34,<1", "anyio>=4.10,<4.12"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../src", ".."]
addopts = "-ra --basetemp=.cache/coordinator-pytest"
filterwarnings = ["error"]
