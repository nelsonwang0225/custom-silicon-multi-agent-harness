[project]
name = "stratos-program-investigator"
version = "0.1.0"
description = "One read-only OpenAI Agents SDK investigator connected exclusively through MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents==0.22.2",
    "mcp==2.2.0",
    "python-dotenv>=1.2.3,<2",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../src", ".."]
addopts = "-ra --basetemp=.cache/investigator-pytest"
filterwarnings = ["error"]
